<!DOCTYPE html>
    <html lang="PT-BR">

    <head>
        <meta charset="utf-8">
        <title>pagina</title>
    </style>

    </head>

    <body>
        <h1 style="text-align: center ;">Meu site</h1>
        
        <div style="background-color:darkgreen; padding: 10px; border-radius: 15px; width: 25%;">
            <p>Botão com mensagem</p>
            <button onclick="bemvindo()">Botão</button>
        </div>

        <h3>Alteração de texto na tela</h3>
        <div style="background-color: darkgreen; padding: 10px; border-radius: 15px; width: 25%;">
            <button onclick="jose()">clique aqui</button>
            <p id="saida">12345</p>
        </div>

        <h3>Verificação de idade (condicional)</h3>
        <div style="background-color: darkgreen; padding: 10px; border-radius: 15px; width: 25%;">
            <input type="number" id="idade" placeholder="digite sua idade...">
            <button onclick="idade()">enviar</button>
            <p id="resultado">Você é:</p>
        </div>
        
        <h3>Contador com laço</h3>
        <div style="background-color: darkgreen; padding: 10px; border-radius: 15px; width: 25%;">
            <button onclick="Numeros()">1 a 10</button>
            <div id="numero" style="margin-top: 15px; font-family: sans-serif;"></div>
        </div>

        <h3>Verificador de Notas</h3>
        <div class="container" style="background-color: darkgreen; padding: 10px; border-radius: 15px; width: 25%;">
            <input type="number" id="Nota" placeholder="Digite a nota (0 a 10)" step="0.1" min="0" max="10">
            <br>
            <button onclick="verificarNota()">Verificar</button>
            <p id="nota"></p>
        </div>

        <script >
            function bemvindo(){
                alert("bem vindo")
            }
            
            function jose() {
                document.getElementById("saida").innerText="67890";
            }
            function idade() {
                let idade = document.getElementById("idade").value;
                if (idade >= 18)
                    document.getElementById("resultado").innerText="Você é: Maior de idade";
                if (idade < 18)
                    document.getElementById("resultado").innerText="Você é: Menor de idade";
            } 
            function Numeros() {
                let numeros = "";
                    for (let i = 1; i <= 10; i++) {
                        numeros += i + "<br>";
                    }
                    document.getElementById("numero").innerHTML = numeros;
            }

            function verificarNota() {
                let inputNota = document.getElementById("Nota").value;
                let nota = parseFloat(inputNota);

                if (isNaN(nota) || nota < 0 || nota > 10) {
                    alert("Por favor, digite uma nota válida entre 0 e 10.");
                    return;
                }

                let resultadoTexto = "";
                if (nota >= 6) {
                    resultadoTexto = "Aprovado";
                } else {
                    resultadoTexto = "Reprovado";
                }

                    document.getElementById("nota").innerText = "Status: " + resultadoTexto;
            }
        </script>
    </body>
    </html>
